name: Release Build

on:
  release:
    types: [published]

jobs:
  release-build:
    name: Release Build
    runs-on: macos-26
    outputs:
      sha: ${{ steps.sha256.outputs.sha256 }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Build executable
        run: |
          swift build \
          --configuration release \
          --product swift-package-list \
          --arch arm64 \
          --arch x86_64
      - name: Archive executable
        run: |
          tar -c -v -z \
          -f swift-package-list.tar.gz \
          -C .build/apple/Products/Release \
          swift-package-list
      - name: Upload archived executable to release
        run: |
          gh release upload ${{ env.TAG }} swift-package-list.tar.gz
      - name: Create SHA256
        id: sha256
        run: |
          SHA256=($(shasum -a 256 swift-package-list.tar.gz))
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
  
  update-formula:
    name: Update Formula
    runs-on: ubuntu-latest
    needs: release-build
    env:
      TAG: ${{ github.ref_name }}
      SHA256: ${{ needs.release-build.outputs.sha }}
    steps:
      - name: Checkout FelixHerrmann/homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: 'FelixHerrmann/homebrew-tap'
      - name: Update Formula
        run: |
          sed -i "s|download\/.*\/swift-package-list|download\/$TAG\/swift-package-list|g" Formula/swift-package-list.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA256\"|g" Formula/swift-package-list.rb
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: swift-package-list/${{ env.TAG }}
          title: Release swift-package-list ${{ env.TAG }}
          body: This automated PR will update swift-package-list to version ${{ env.TAG }}.
          commit-message: Bump swift-package-list to ${{ env.TAG }}
          labels: release, automated pr
          delete-branch: true
  
  release-artifactbundle:
    name: Release Artifact Bundle
    runs-on: macos-latest
    needs: release-build
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Create artifactbundle
        run: |
          mkdir -p SwiftPackageListBinary.artifactbundle/swift-package-list-macos/bin
          cp .build/apple/Products/Release/swift-package-list \
            SwiftPackageListBinary.artifactbundle/swift-package-list-macos/bin/swift-package-list

          cat > SwiftPackageListBinary.artifactbundle/info.json << EOF
          {
            "schemaVersion": "1.0",
            "artifacts": {
              "swift-package-list": {
                "type": "executable",
                "version": "${TAG}",
                "variants": [
                  {
                    "path": "swift-package-list-macos/bin/swift-package-list",
                    "supportedTriples": ["arm64-apple-macosx", "x86_64-apple-macosx"]
                  }
                ]
              }
            }
          }
          EOF

          zip -r SwiftPackageListBinary.artifactbundle.zip SwiftPackageListBinary.artifactbundle

      - name: Upload artifactbundle to release
        run: |
          gh release upload ${{ env.TAG }} SwiftPackageListBinary.artifactbundle.zip

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum SwiftPackageListBinary.artifactbundle.zip)
          echo "value=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Update Package.swift
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/SwiftPackageListBinary.artifactbundle.zip"
          CHECKSUM="${{ steps.checksum.outputs.value }}"

          python3 - <<PYEOF
          import re

          with open("Package.swift", "r") as f:
              content = f.read()

          new_target = f"""        // BINARY_TARGET_START
          .binaryTarget(
              name: "SwiftPackageListBinary",
              url: "{URL}",
              checksum: "{CHECKSUM}"
          ),
          // BINARY_TARGET_END"""

          updated = re.sub(
              r'// BINARY_TARGET_START.*?// BINARY_TARGET_END',
              new_target,
              content,
              flags=re.DOTALL
          )

          if updated == content:
              insert = f"""
          // BINARY_TARGET_START
          .binaryTarget(
              name: "SwiftPackageListBinary",
              url: "{URL}",
              checksum: "{CHECKSUM}"
          ),
          // BINARY_TARGET_END"""
              updated = re.sub(r'(\s*\]\s*\)\s*$)', insert + r'\1', updated, count=1)

          with open("Package.swift", "w") as f:
              f.write(updated)
          PYEOF

      - name: Commit and push Package.swift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update SwiftPackageListBinary to ${TAG} [skip ci]"
          git push origin HEAD:master